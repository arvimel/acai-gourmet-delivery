<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo Central - SaaS Cardápio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-ativa { border-bottom-width: 2px; border-color: #f59e0b; color: #f59e0b; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 text-sm">

    <!-- Topo do Painel com Logo à Esquerda -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center shadow-inner flex-shrink-0 overflow-hidden">
                    <img id="painelLogo" src="https://placehold.co/40x40?text=Loja" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">Painel Administrativo</h1>
                    <p class="text-[11px] text-slate-400">Gestão de Cardápio & Marketing</p>
                </div>
            </div>
            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-medium">
                <i class="fa-solid fa-circle text-[8px] mr-1 animate-pulse"></i> Servidor Ativo
            </span>
        </div>
    </header>

    <!-- Menu de Navegação -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 flex gap-6">
            <button onclick="mudarAba('produtos')" id="tab-produtos" class="tab-ativa py-3 px-1 text-gray-500 hover:text-amber-500 transition cursor-pointer flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> Produtos
            </button>
            <button onclick="mudarAba('marketing')" id="tab-marketing" class="py-3 px-1 text-gray-500 hover:text-amber-500 transition cursor-pointer flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> Marketing e Combos
            </button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-5xl mx-auto p-4 sm:p-6">
        
        <!-- ABA: PRODUTOS (DINÂMICA) -->
        <section id="conteudo-produtos" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-bold text-gray-900">Itens do Cardápio</h2>
                <button onclick="abrirModalProduto()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow transition cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Novo Produto
                </button>
            </div>
            
            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                <div class="p-4 bg-gray-50 border-b border-gray-200 font-bold text-gray-600 grid grid-cols-4 gap-4 text-xs uppercase tracking-wider">
                    <div>Produto</div>
                    <div>Categoria</div>
                    <div>Preço</div>
                    <div class="text-right">Ações</div>
                </div>
                <div id="container-lista-produtos" class="divide-y divide-gray-100">
                    <p class="text-center py-8 text-gray-400 animate-pulse">Buscando produtos da planilha...</p>
                </div>
            </div>
        </section>

        <!-- ABA: MARKETING -->
        <section id="conteudo-marketing" class="hidden max-w-md mx-auto">
            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-gray-100 bg-slate-50 flex items-center gap-2">
                    <i class="fa-solid fa-window-restore text-amber-500"></i>
                    <h2 class="font-bold text-gray-900">Janela Flutuante de Ofertas</h2>
                </div>
                <form id="formMarketing" onsubmit="salvarConfigMarketing(event)" class="p-6 space-y-4">
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border">
                        <div>
                            <label class="font-bold text-gray-700 block text-xs">Ativar Janela Flutuante?</label>
                        </div>
                        <input type="checkbox" id="promo_ativa" class="w-5 h-5 accent-amber-500 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Título do Destaque</label>
                        <input type="text" id="promo_titulo" required class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Texto da Oferta</label>
                        <textarea id="promo_descricao" rows="3" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Link da Imagem</label>
                        <input type="url" id="promo_foto" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl shadow cursor-pointer">Salvar e Aplicar</button>
                </form>
            </div>
        </section>
    </main>

    <!-- MODAL INTEGRADO: NOVO / EDITAR PRODUTO -->
    <div id="modalProduto" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-4 bg-slate-900 text-white font-bold flex justify-between items-center">
                <h3 id="modalProdutoTitulo" class="text-sm">Novo Produto</h3>
                <button onclick="fecharModalProduto()" class="text-gray-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form id="formProduto" onsubmit="enviarFormProduto(event)" class="p-6 space-y-3">
                <input type="hidden" id="prod_id">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Nome do Produto</label>
                    <input type="text" id="prod_nome" required class="w-full border border-gray-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Preço (R$)</label>
                        <input type="number" step="0.01" id="prod_preco" required class="w-full border border-gray-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Categoria</label>
                        <input type="text" id="prod_categoria" placeholder="Ex: Combos" required class="w-full border border-gray-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Descrição</label>
                    <textarea id="prod_descricao" rows="2" class="w-full border border-gray-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">URL da Foto</label>
                    <input type="url" id="prod_foto" class="w-full border border-gray-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Disponibilidade</label>
                    <select id="prod_status" class="w-full border border-gray-300 rounded-xl p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <option value="Disponível">Disponível</option>
                        <option value="Indisponível">Indisponível</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl shadow cursor-pointer mt-2">Salvar Item no Cardápio</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxOjeW76WQYdksHvgXFTC5BCviwlTeUtg_5EOVgxsN8xPosOafe-gj8WDpPryCYmvDf/exec";
        const TOKEN_SEGURANCA = "acai_gourmet_pro_2026";
        let produtosLocais = [];

        function mudarAba(aba) {
            document.getElementById("conteudo-produtos").classList.toggle("hidden", aba !== 'produtos');
            document.getElementById("conteudo-marketing").classList.toggle("hidden", aba !== 'marketing');
            document.getElementById("tab-produtos").classList.toggle("tab-ativa", aba === 'produtos');
            document.getElementById("tab-marketing").classList.toggle("tab-ativa", aba === 'marketing');
            if(aba === 'marketing') carregarConfigMarketing();
        }

        async function carregarProdutos() {
            const container = document.getElementById("container-lista-produtos");
            try {
                const r = await fetch(`${API_URL}?sheet=Produtos&_t=${Date.now()}`);
                produtosLocais = await r.json();
                container.innerHTML = "";
                
                if(produtosLocais.length === 0) {
                    container.innerHTML = `<p class="text-center py-6 text-gray-400">Nenhum produto cadastrado.</p>`;
                    return;
                }

                produtosLocais.forEach(p => {
                    container.innerHTML += `
                        <div class="p-4 grid grid-cols-4 gap-4 items-center">
                            <div class="font-medium text-gray-900">${p.nome}</div>
                            <div class="text-gray-500 text-xs">${p.categoria}</div>
                            <div class="font-bold text-slate-700">R$ ${parseFloat(p.preco).toFixed(2)}</div>
                            <div class="text-right space-x-3">
                                <button onclick='abrirModalProduto(${JSON.stringify(p)})' class="text-slate-400 hover:text-amber-500 cursor-pointer"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deletarProduto('${p.id}')" class="text-slate-400 hover:text-red-500 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { container.innerHTML = `<p class="text-center py-6 text-red-500">Erro de conexão.</p>`; }
        }

        function abrirModalProduto(prod = null) {
            document.getElementById("formProduto").reset();
            if (prod) {
                document.getElementById("modalProdutoTitulo").innerText = "Editar Produto";
                document.getElementById("prod_id").value = prod.id;
                document.getElementById("prod_nome").value = prod.nome;
                document.getElementById("prod_preco").value = prod.preco;
                document.getElementById("prod_categoria").value = prod.categoria;
                document.getElementById("prod_descricao").value = prod.descricao || "";
                document.getElementById("prod_foto").value = prod.foto || "";
                document.getElementById("prod_status").value = prod.status;
            } else {
                document.getElementById("modalProdutoTitulo").innerText = "Novo Produto";
                document.getElementById("prod_id").value = "PROD_" + Date.now();
            }
            document.getElementById("modalProduto").classList.remove("hidden");
        }

        function fecharModalProduto() { document.getElementById("modalProduto").classList.add("hidden"); }

        async function enviarFormProduto(e) {
            e.preventDefault();
            const idExistente = produtosLocais.some(x => x.id === document.getElementById("prod_id").value);
            const payload = {
                action: idExistente ? "edit" : "add",
                token: TOKEN_SEGURANCA,
                sheet: "Produtos",
                id: document.getElementById("prod_id").value,
                nome: document.getElementById("prod_nome").value,
                preco: document.getElementById("prod_preco").value,
                categoria: document.getElementById("prod_categoria").value,
                descricao: document.getElementById("prod_descricao").value,
                foto: document.getElementById("prod_foto").value,
                status: document.getElementById("prod_status").value
            };

            const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
            const res = await r.json();
            if(res.status === "success") { fecharModalProduto(); carregarProdutos(); }
        }

        async function deletarProduto(id) {
            if(!confirm("Deseja realmente excluir este item?")) return;
            const payload = { action: "delete", token: TOKEN_SEGURANCA, sheet: "Produtos", id: id };
            await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
            carregarProdutos();
        }

        async function carregarConfigMarketing() {
            const resp = await fetch(`${API_URL}?sheet=Config&_t=${Date.now()}`);
            const linhas = await resp.json();
            linhas.forEach(l => {
                if (l.chave === "promo_ativa") document.getElementById("promo_ativa").checked = (l.valor === "true");
                if (l.chave === "promo_titulo") document.getElementById("promo_titulo").value = l.valor;
                if (l.chave === "promo_descricao") document.getElementById("promo_descricao").value = l.valor;
                if (l.chave === "promo_foto") document.getElementById("promo_foto").value = l.valor;
                if (l.chave === "logo_url") document.getElementById("painelLogo").src = l.valor;
            });
        }

        async function salvarConfigMarketing(e) {
            e.preventDefault();
            const payload = {
                action: "save_config", token: TOKEN_SEGURANCA,
                config: {
                    promo_ativa: document.getElementById("promo_ativa").checked ? "true" : "false",
                    promo_titulo: document.getElementById("promo_titulo").value,
                    promo_descricao: document.getElementById("promo_descricao").value,
                    promo_foto: document.getElementById("promo_foto").value
                }
            };
            const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
            const res = await response.json();
            if (res.status === "success") { alert("Campanha de Marketing atualizada!"); mudarAba('produtos'); }
        }

        window.onload = function() { carregarProdutos(); carregarConfigMarketing(); };
    </script>
</body>
</html>
