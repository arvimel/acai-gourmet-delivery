<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - SaaS Cardápio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-6 text-sm text-gray-800">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        <div class="bg-slate-900 text-white p-5">
            <h2 class="text-lg font-bold">Configurações de Marketing</h2>
            <p class="text-xs text-slate-400">Controle a promoção do dia e destaques do cardápio</p>
        </div>

        <form id="formPromo" onsubmit="salvarConfigPromo(event)" class="p-6 space-y-4">
            
            <!-- Toggle Ativar/Desativar -->
            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
                <div>
                    <label class="font-bold text-gray-700 block">Promoção Especial Ativa?</label>
                    <span class="text-xs text-gray-400">Exibir pop-up ao abrir o cardápio</span>
                </div>
                <input type="checkbox" id="promo_ativa" class="w-5 h-5 accent-amber-500 cursor-pointer">
            </div>

            <!-- Título da Oferta -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Título da Promoção</label>
                <input type="text" id="promo_titulo" placeholder="Ex: Combo Casal Imperdível! 🔥" class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <!-- Descrição da Oferta -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Descrição do Pop-up</label>
                <textarea id="promo_descricao" rows="2" placeholder="Ex: 2 Açaís de 500ml + adicionais grátis por apenas..." class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
            </div>

            <!-- Foto do Produto em Destaque -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Link da Foto da Promoção</label>
                <input type="url" id="promo_foto" placeholder="https://linkdafoto.com/imagem.jpg" class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-amber-500">
                <span class="text-[11px] text-gray-400 mt-1 block">Deixe em branco para exibir apenas o texto.</span>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-4 rounded-xl shadow transition cursor-pointer text-center">
                Salvar Configurações
            </button>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxOjeW76WQYdksHvgXFTC5BCviwlTeUtg_5EOVgxsN8xPosOafe-gj8WDpPryCYmvDf/exec";
        const TOKEN_SEGURANCA = "acai_gourmet_pro_2026";

        async function salvarConfigPromo(e) {
            e.preventDefault();
            
            const payload = {
                action: "save_config",
                token: TOKEN_SEGURANCA,
                config: {
                    promo_ativa: document.getElementById("promo_ativa").checked ? "true" : "false",
                    promo_titulo: document.getElementById("promo_titulo").value,
                    promo_descricao: document.getElementById("promo_descricao").value,
                    promo_foto: document.getElementById("promo_foto").value
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                
                const res = await response.json();
                if (res.status === "success") {
                    alert("Configurações atualizadas com sucesso!");
                } else {
                    alert("Erro ao atualizar: " + res.message);
                }
            } catch (err) {
                alert("Falha de conexão com a API.");
            }
        }
    </script>
</body>
</html>
