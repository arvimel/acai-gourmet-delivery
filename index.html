<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açaí Gourmet - Cardápio Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- Cabeçalho da Loja -->
    <header class="bg-slate-900 text-white text-center py-8 px-4 shadow-md">
        <h1 class="text-3xl font-extrabold text-amber-500 tracking-wide">Açaí Gourmet</h1>
        <p class="text-gray-400 text-sm mt-1">Pizzaria e Hamburgueria</p>
        <div class="inline-block bg-green-500/20 text-green-400 text-xs font-semibold px-3 py-1 rounded-full mt-3 border border-green-500/30">
            <i class="fa-solid fa-circle text-[9px] mr-1 animate-pulse"></i> Aberto para Pedidos
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Vitrine de Produtos -->
        <div id="cardapio-container" class="space-y-6">
            <!-- As categorias e itens serão injetados aqui via JS -->
            <p class="text-center text-gray-400 py-8 animate-pulse">Carregando cardápio gostoso...</p>
        </div>

    </main>

    <!-- Barra Fixa Inferior (Carrinho) -->
    <div id="barra-carrinho" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-xl hidden z-40">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-400 uppercase font-semibold">Seu Carrinho</p>
                <p class="text-lg font-bold text-slate-900" id="carrinho-total">R$ 0,00</p>
            </div>
            <button onclick="abrirCheckout()" class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow transition cursor-pointer flex items-center gap-2">
                Ver Pedido <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Tela de Fechamento do Pedido (Checkout) -->
    <div id="modalCheckout" class="fixed inset-0 bg-black/60 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 overflow-y-auto">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-slate-900 text-white rounded-t-2xl sm:rounded-t-2xl">
                <h3 class="font-bold text-lg">Finalizar Pedido</h3>
                <button onclick="fecharCheckout()" class="text-gray-400 hover:text-white text-xl p-1 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form onsubmit="enviarPedido(event)" class="p-6 space-y-4 overflow-y-auto flex-1 text-sm">
                <!-- Seção de Dados Pessoais -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Seu Nome</label>
                    <input type="text" id="cliNome" required class="w-full border border-gray-300 rounded-xl p-3 focus:outline-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">WhatsApp</label>
                    <input type="tel" id="cliWhats" placeholder="(63) 99999-9999" required class="w-full border border-gray-300 rounded-xl p-3 focus:outline-amber-500">
                </div>

                <!-- Seção de Entrega com GPS -->
                <div class="border-t border-gray-100 pt-4">
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Endereço de Entrega</label>
                    <textarea id="cliEndereco" rows="2" placeholder="Rua, Número, Bairro e Ponto de referência" required class="w-full border border-gray-300 rounded-xl p-3 focus:outline-amber-500 mb-2"></textarea>
                    
                    <!-- Botão do GPS -->
                    <button type="button" onclick="capturarLocalizacao()" id="btnGps" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-4 rounded-xl transition cursor-pointer text-xs flex items-center justify-center gap-2 border border-gray-200">
                        <i class="fa-solid fa-location-crosshairs text-amber-500"></i> <span id="txtGps">Usar minha localização atual (GPS)</span>
                    </button>
                    <input type="hidden" id="cliGps">
                </div>

                <!-- Observações -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Observações do Pedido</label>
                    <input type="text" id="cliObs" placeholder="Ex: Tirar cebola, ponto da carne, etc." class="w-full border border-gray-300 rounded-xl p-3 focus:outline-amber-500">
                </div>

                <!-- Forma de Pagamento -->
                <div class="border-t border-gray-100 pt-4">
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Forma de Pagamento</label>
                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <label class="border border-gray-200 p-3 rounded-xl flex items-center gap-2 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                            <input type="radio" name="pagamento" value="Pix" checked class="accent-amber-500">
                            <span class="font-medium"><i class="fa-solid fa-pix text-teal-500 mr-1"></i> Pix</span>
                        </label>
                        <label class="border border-gray-200 p-3 rounded-xl flex items-center gap-2 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                            <input type="radio" name="pagamento" value="Cartão" class="accent-amber-500">
                            <span class="font-medium"><i class="fa-solid fa-credit-card text-blue-500 mr-1"></i> Cartão</span>
                        </label>
                    </div>
                </div>

                <!-- Botão Confirmar -->
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition cursor-pointer text-base mt-4">
                    Confirmar e Pagar
                </button>
            </form>
        </div>
    </div>

    <script>
        // ATENÇÃO: Cole a URL copiada do seu Apps Script entre as aspas abaixo:
        const API_URL = "https://script.google.com/macros/s/AKfycbwscI-V0klLDuxlrlSemnW03TJTTUVcT8--B0oX7rhVzRfnWgrbLiVCjnP1X4SO81pS/exec"; 

        let carrinho = {};
        let produtosGlobais = [];

        async function carregarCardapio() {
            try {
                const response = await fetch(`${API_URL}?sheet=Produtos`);
                produtosGlobais = await response.json();
                
                const container = document.getElementById("cardapio-container");
                container.innerHTML = "";

                // Filtrar apenas produtos disponíveis
                const disponiveis = produtosGlobais.filter(p => p.status === "Disponível");

                // Agrupar por categoria
                const categorias = [...new Set(disponiveis.map(p => p.categoria))];

                if(categorias.length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-400 py-8">Nenhum item disponível no momento.</p>`;
                    return;
                }

                categorias.forEach(cat => {
                    let htmlCat = `<div class="space-y-3"><h2 class="text-lg font-bold text-slate-900 border-l-4 border-amber-500 pl-2 uppercase tracking-wide text-xs">${cat}</h2><div class="space-y-3">`;
                    
                    const itensCat = disponiveis.filter(p => p.categoria === cat);
                    itensCat.forEach(p => {
                        htmlCat += `
                            <div class="bg-white p-3 rounded-xl shadow-xs border border-gray-100 flex gap-3 items-center">
                                <img src="${p.foto || 'https://placehold.co/80x80?text=Sem+Foto'}" class="w-20 h-20 object-cover rounded-lg border border-gray-100 flex-shrink-0">
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold text-gray-900 text-sm truncate">${p.nome}</h3>
                                    <p class="text-xs text-gray-400 line-clamp-2 mt-0.5">${p.descricao || ''}</p>
                                    <div class="flex justify-between items-center mt-2">
                                        <span class="font-bold text-amber-600 text-sm">R$ ${parseFloat(p.preco).toFixed(2)}</span>
                                        <div class="flex items-center gap-2">
                                            <button onclick="alterarQtd('${p.id}', -1)" class="w-7 h-7 bg-gray-100 active:bg-gray-200 rounded-lg font-bold text-gray-600 flex items-center justify-center cursor-pointer text-xs">-</button>
                                            <span id="qtd-${p.id}" class="font-semibold text-sm w-4 text-center">0</span>
                                            <button onclick="alterarQtd('${p.id}', 1)" class="w-7 h-7 bg-amber-500 active:bg-amber-600 rounded-lg font-bold text-white flex items-center justify-center cursor-pointer text-xs">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    htmlCat += `</div></div>`;
                    container.innerHTML += htmlCat;
                });
            } catch (e) { console.error(e); }
        }

        function alterarQtd(id, mudanca) {
            if (!carrinho[id]) carrinho[id] = 0;
            carrinho[id] += mudanca;
            if (carrinho[id] <= 0) delete carrinho[id];
            
            document.getElementById(`qtd-${id}`).innerText = carrinho[id] || 0;
            atualizarBarraCarrinho();
        }

        function calcularTotal() {
            let total = 0;
            Object.keys(carrinho).forEach(id => {
                const prod = produtosGlobais.find(p => p.id === id);
                if (prod) total += prod.preco * carrinho[id];
            });
            return total;
        }

        function atualizarBarraCarrinho() {
            const total = calcularTotal();
            const barra = document.getElementById("barra-carrinho");
            if (total > 0) {
                document.getElementById("carrinho-total").innerText = `R$ ${total.toFixed(2)}`;
                barra.classList.remove("hidden");
            } else {
                barra.classList.add("hidden");
            }
        }

        function abrirCheckout() { document.getElementById("modalCheckout").classList.remove("hidden"); }
        function fecharCheckout() { document.getElementById("modalCheckout").classList.add("hidden"); }

        function capturarLocalizacao() {
            const btn = document.getElementById("btnGps");
            const txt = document.getElementById("txtGps");
            
            if (!navigator.geolocation) { alert("GPS não suportado pelo seu navegador."); return; }
            
            txt.innerText = "Localizando...";
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                document.getElementById("cliGps").value = `https://www.google.com/maps?q=${lat},${lng}`;
                btn.classList.replace("bg-slate-100", "bg-green-50");
                btn.classList.add("border-green-300");
                txt.innerHTML = "<span class='text-green-700 font-semibold'><i class='fa-solid fa-check'></i> GPS Vinculado com Sucesso!</span>";
            }, (err) => {
                txt.innerText = "Erro ao capturar GPS";
                alert("Por favor, ative a localização no seu celular.");
            });
        }

        async function enviarPedido(e) {
            e.preventDefault();
            
            let itensArray = [];
            Object.keys(carrinho).forEach(id => {
                const prod = produtosGlobais.find(p => p.id === id);
                if (prod) itensArray.push(`${carrinho[id]}x ${prod.nome}`);
            });

            const payload = {
                action: "novo_pedido",
                id: "PED_" + Date.now(),
                cliente: document.getElementById("cliNome").value + " (" + document.getElementById("cliWhats").value + ")",
                itens: itensArray.join(", "),
                total: calcularTotal().toFixed(2),
                forma_pagamento: document.querySelector('input[name="pagamento"]:checked').value,
                endereco_digitado: document.getElementById("cliEndereco").value,
                localizacao_gps: document.getElementById("cliGps").value || "Não enviada",
                observacoes: document.getElementById("cliObs").value || "Nenhuma"
            };

            // Salva na Planilha
            await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            
            alert("Pedido enviado! Na próxima fase integraremos a tela de pagamento do Asaas.");
            fecharCheckout();
            carrinho = {};
            atualizarBarraCarrinho();
            carregarCardapio();
        }

        window.onload = carregarCardapio;
    </script>
</body>
</html>
